name: Coq 8.18.0 Verification

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.18.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify all Coq proofs and assumption gates
        run: make verify
